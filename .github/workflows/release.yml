name: Build portable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the portable package to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build onedir portable folder
        shell: cmd
        env:
          MK_MOLE_NO_PAUSE: "1"
        run: build_exe.bat

      - name: Compress portable folder
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $src = "dist/MK-MOLE"
          $zip = "dist/BuildMolecule-portable-win64-$tag.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $src -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object FullName, Length
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          $zip = "dist/BuildMolecule-portable-win64-$tag.zip"
          gh release upload $tag $zip --clobber
